apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-server
  labels:
    app: ml-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-server
  template:
    metadata:
      labels:
        app: ml-server
    spec:
      containers:
        - name: ml-server
          image: fraud-ml-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          env:
            - name: MODEL_SERVER_PORT
              value: "8001"
            - name: ML_THRESHOLD
              value: "0.5"
            - name: CLICKHOUSE_HOST
              value: "clickhouse-service"
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: fraud-pipeline-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-pipeline-secrets
                  key: CLICKHOUSE_PASSWORD
          # livenessProbe restarts the pod if the /health endpoint stops responding,
          # indicating the server has crashed or become unresponsive.
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          # readinessProbe prevents traffic from reaching the pod until the model
          # is fully loaded and the server is ready to serve /predict requests.
          # Without this, Flink may call /predict before the XGBoost model is loaded.
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ml-server-service
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: ml-server
