apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-server
  labels:
    app: ml-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-server
  template:
    metadata:
      labels:
        app: ml-server
    spec:
      containers:
        - name: ml-server
          image: fraud-ml-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: MODEL_SERVER_PORT
              value: "8001"
            - name: ML_THRESHOLD
              value: "0.5"
---
apiVersion: v1
kind: Service
metadata:
  name: ml-server-service
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: ml-server
