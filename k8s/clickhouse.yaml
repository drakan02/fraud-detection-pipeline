apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-init-config
data:
  01_schema.sql: |
    -- ─────────────────────────────────────────────────────────────────────────
    -- Table: transactions
    --   Stores raw transaction business fields arriving from Flink JDBC sink.
    --   ReplacingMergeTree(ingested_at) deduplicates on ORDER BY key (id),
    --   keeping the row with the latest ingested_at on background merge.
    -- ─────────────────────────────────────────────────────────────────────────
    CREATE TABLE IF NOT EXISTS default.transactions (
        id           String,
        amount       Decimal(12, 2),
        event_time   DateTime64(3),
        ingested_at  DateTime DEFAULT now()
    ) ENGINE = ReplacingMergeTree(ingested_at)
    PARTITION BY toYYYYMM(event_time)
    ORDER BY (event_time, id);

    -- ─────────────────────────────────────────────────────────────────────────
    -- Table: ground_truth
    --   Stores the actual class label for each transaction separately from
    --   the transaction record itself. This simulates the real-world pattern
    --   where fraud labels arrive via a dispute-resolution process AFTER the
    --   original transaction — not at inference time.
    --   Used by the CM (Confusion Matrix) query instead of transactions.status.
    -- ─────────────────────────────────────────────────────────────────────────
    CREATE TABLE IF NOT EXISTS default.ground_truth (
        transaction_id  String,
        actual_label    String,        -- 'FRAUD' | 'SUCCESS'
        created_at      DateTime64(3) DEFAULT now()
    ) ENGINE = ReplacingMergeTree()
    PARTITION BY toYYYYMM(created_at)
    ORDER BY transaction_id;

    -- ─────────────────────────────────────────────────────────────────────────
    -- Table: fraud_alerts
    --   Append-only alert log; each alert has its own UUID so dedup is
    --   meaningless — plain MergeTree is the correct engine here.
    -- ─────────────────────────────────────────────────────────────────────────
    CREATE TABLE IF NOT EXISTS default.fraud_alerts (
        id              String,
        transaction_id  String,
        pattern_id      String,
        pattern_name    String,
        severity        String,
        amount          Float64,
        description     String,
        source          String,
        ml_probability  Float32,   -- probability in [0,1]; Float32 precision is sufficient
        detected_at     DateTime64(3) DEFAULT now()
    ) ENGINE = MergeTree()
    PARTITION BY toYYYYMM(detected_at)
    ORDER BY (detected_at, id);

    -- ─────────────────────────────────────────────────────────────────────────
    -- Table: model_predictions
    --   One row per (transaction, model_version) pair.
    --   ORDER BY (transaction_id, model_version) so ReplacingMergeTree can
    --   dedup retried predictions correctly.
    -- ─────────────────────────────────────────────────────────────────────────
    CREATE TABLE IF NOT EXISTS default.model_predictions (
        transaction_id  String,
        model_version   String,
        probability     Float64,
        prediction      UInt8,
        predicted_at    DateTime64(3) DEFAULT now(),
        INDEX idx_predicted_at predicted_at TYPE minmax GRANULARITY 1
    ) ENGINE = ReplacingMergeTree()
    PARTITION BY toYYYYMM(predicted_at)
    ORDER BY (transaction_id, model_version);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  labels:
    app: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: fraud-pipeline-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-pipeline-secrets
                  key: CLICKHOUSE_PASSWORD
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: clickhouse-data
          persistentVolumeClaim:
            claimName: clickhouse-pvc
        - name: clickhouse-init
          configMap:
            name: clickhouse-init-config
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
  selector:
    app: clickhouse
