apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-config
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider-config
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: "Fraud Pipeline Dashboards"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-json-config
data:
  fraud_pipeline.json: |

    {
      "__inputs": [],
      "__requires": [
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "10.4.0"
        },
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        }
      ],
      "annotations": {
        "list": []
      },
      "description": "Operational dashboard for the real-time fraud detection pipeline.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Scored Transactions",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(fraud_predictions_total) or vector(0)",
              "legendFormat": "predictions",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Fraud Alerts",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(fraud_predictions_total{is_fraud=\"true\"}) or vector(0)",
              "legendFormat": "alerts",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Fraud Rate (%)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 3,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1.0
                  },
                  {
                    "color": "red",
                    "value": 5.0
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 * (sum(fraud_predictions_total{is_fraud=\"true\"}) or vector(0)) / clamp_min((sum(fraud_predictions_total) or vector(0)), 1)",
              "legendFormat": "fraud rate",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Model Latency (p95)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 300
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{handler=\"/predict\"}[5m])) by (le)) * 1000",
              "legendFormat": "p95",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Malformed Ingestion",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(increase({__name__=~\".*fraud_pipeline_malformed_messages_total\"}[5m])) or vector(0)",
              "legendFormat": "malformed",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Active Model",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "name"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(fraud_model_info) by (version)",
              "legendFormat": "{{version}}",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Pipeline Volume & Alert Rate",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2.5,
                "fillOpacity": 8,
                "gradientMode": "opacity"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(fraud_predictions_total[5m])) or vector(0)",
              "legendFormat": "scored/s",
              "datasource": "Prometheus"
            },
            {
              "expr": "sum(rate(fraud_predictions_total{is_fraud=\"true\"}[5m])) or vector(0)",
              "legendFormat": "alerts/s",
              "datasource": "Prometheus"
            },
            {
              "expr": "sum(rate({__name__=~\".*fraud_pipeline_valid_messages_total\"}[5m])) or vector(0)",
              "legendFormat": "ingested/s",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Model Serving Latency",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2.5,
                "fillOpacity": 8,
                "gradientMode": "opacity"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "((sum(rate(http_request_duration_seconds_sum{handler=\"/predict\"}[5m])) or vector(0)) / clamp_min((sum(rate(http_request_duration_seconds_count{handler=\"/predict\"}[5m])) or vector(0)), 0.000001)) * 1000",
              "legendFormat": "avg latency",
              "datasource": "Prometheus"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{handler=\"/predict\"}[5m])) by (le)) * 1000",
              "legendFormat": "p95 latency",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "API Status & Ingestion Quality",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "gradientMode": "opacity"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{handler=\"/predict\", status=~\"2..\"}[5m])) or vector(0)",
              "legendFormat": "2xx/s (success)",
              "datasource": "Prometheus"
            },
            {
              "expr": "sum(rate(http_requests_total{handler=\"/predict\", status=~\"5..\"}[5m])) or vector(0)",
              "legendFormat": "5xx/s (error)",
              "datasource": "Prometheus"
            },
            {
              "expr": "sum(rate({__name__=~\".*fraud_pipeline_malformed_messages_total\"}[5m])) or vector(0)",
              "legendFormat": "malformed/s",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Model Features Drift & Prob Mean",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "gradientMode": "opacity"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "model_feature_drift_zscore > 1.0",
              "legendFormat": "{{feature}}",
              "datasource": "Prometheus"
            },
            {
              "expr": "model_prediction_mean_probability or vector(0)",
              "legendFormat": "mean probability",
              "datasource": "Prometheus"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "fraud",
        "flink",
        "kafka",
        "ml",
        "operations"
      ],
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Fraud Pipeline Operations",
      "uid": "fraud-pipeline-operations",
      "version": 4
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-pipeline-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/fraud_pipeline.json"
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: grafana-dashboards-json
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: storage-volume
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources-config
        - name: grafana-dashboards-provider
          configMap:
            name: grafana-dashboards-provider-config
        - name: grafana-dashboards-json
          configMap:
            name: grafana-dashboards-json-config
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
